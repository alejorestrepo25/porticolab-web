<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZW7VQF6PR"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto - PORTICO LAB</title>

<link rel="icon" href="../iconos/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;}

header{
  width:100%;
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  border-bottom:1px solid #222;
}
.logo{font-size:30px;font-weight:700;letter-spacing:3px;color:#fff;text-decoration:none;position:relative;}
.logo::after{content:'';position:absolute;left:0;bottom:-6px;width:0;height:1px;background:#fff;transition:0.3s;}
.logo:hover::after{width:100%;}
.nav{display:flex;gap:30px;}
.nav a{text-decoration:none;color:#fff;font-size:16px;letter-spacing:1px;position:relative;}
.nav a::after{content:'';position:absolute;left:0;bottom:-6px;width:0;height:1px;background:#fff;transition:0.3s;}
.nav a:hover::after{width:100%;}

/* LOADING */
.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60vh;
  font-size:13px;
  letter-spacing:2px;
  color:#444;
}

/* MAIN */
main{
  padding:60px 40px;
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:start;
}
.post-content h1{font-size:48px;font-weight:700;letter-spacing:2px;line-height:1.2;}
.post-meta{display:flex;gap:20px;font-size:14px;color:#999;padding:20px 0;border-bottom:1px solid #222;margin-bottom:20px;flex-wrap:wrap;}
.precio-badge{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:10px 16px;border:1px solid #333;border-radius:8px;background:#0d0d0d;}
.precio-badge .precio-valor{font-size:18px;font-weight:600;color:#fff;}
.precio-badge .precio-label{font-size:12px;color:#666;letter-spacing:1px;}
.disponible-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;}
.no-disponible-dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;}
.post-content p{line-height:1.8;color:#ccc;font-size:15px;}
#post-features{margin-top:15px;padding-left:24px;color:#ccc;line-height:2;}
#post-features li{margin-bottom:8px;}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
.tag{background:#222;padding:8px 16px;border-radius:20px;font-size:13px;transition:background 0.2s;}
.tag:hover{background:#333;}

/* GALERÍA */
.post-image{display:flex;flex-direction:column;align-items:center;gap:15px;position:sticky;top:20px;}
.post-image img#main-image{width:100%;max-width:550px;border-radius:8px;cursor:pointer;transition:transform 0.3s ease;}
.post-image img#main-image:hover{transform:scale(1.02);}
.mini-gallery{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.mini-gallery img{width:70px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:0.6;transition:all 0.2s;border:2px solid transparent;}
.mini-gallery img:hover{transform:scale(1.1);opacity:1;border-color:#fff;}
.mini-gallery img.active{opacity:1;border-color:#fff;}

/* LIGHTBOX */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:1000;opacity:0;transition:opacity 0.3s ease;}
.lightbox.show{opacity:1;}
.lightbox img{max-width:90%;max-height:80%;border-radius:8px;}
.lightbox-controls{display:flex;gap:20px;margin-top:20px;align-items:center;}
.lightbox-btn{background:#222;color:#fff;border:1px solid #444;padding:10px 20px;border-radius:6px;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:14px;transition:all 0.2s;}
.lightbox-btn:hover{background:#333;}
.lightbox-counter{min-width:60px;text-align:center;font-size:14px;color:#ccc;}
.lightbox-close{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
.lightbox-close:hover{transform:scale(1.2);}

/* MEDIA */
@media(max-width:1024px){
  main{grid-template-columns:1fr;gap:40px;}
  .post-image{position:static;}
}
@media(max-width:768px){
  header{height:auto;flex-direction:column;align-items:flex-start;padding:12px 16px;gap:8px;}
  .logo{font-size:20px;letter-spacing:2px;}
  .nav{gap:16px;}
  .nav a{font-size:11px;letter-spacing:0.5px;}
  main{padding:30px 20px;}
  .post-content h1{font-size:28px;}
  .mini-gallery img{width:50px;height:50px;}
}
</style>
</head>

<body>

<header>
  <a href="../index.html" class="logo">PORTICO_LAB</a>
  <nav class="nav">
    <a href="../laboratorio.html">LABORATORIO</a>
    <a href="../arquitectura.html">ARQUITECTURA</a>
    <a href="../inspiracion.html">INSPIRACIÓN</a>
    <a href="../nosotros.html">NOSOTROS</a>
  </nav>
</header>

<div class="loading" id="loading">CARGANDO...</div>

<main id="main-content" style="display:none;">
  <div class="post-image">
    <img id="main-image" src="" alt="">
    <div class="mini-gallery" id="mini-gallery"></div>
  </div>

  <div class="post-content">
    <h1 id="post-title"></h1>
    <div class="post-meta">
      <span id="post-location"></span>
      <span id="post-year"></span>
    </div>
    <p id="post-description"></p>
    <ul id="post-features"></ul>
    <div id="precio-badge" style="display:none;" class="precio-badge">
      <span id="disponible-dot"></span>
      <div>
        <div class="precio-label">PRECIO</div>
        <div class="precio-valor" id="precio-valor"></div>
      </div>
    </div>
    <div class="tags" id="post-tags"></div>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="close-btn">&times;</button>
  <img id="lightbox-img">
  <div class="lightbox-controls">
    <button class="lightbox-btn" id="prev">← Anterior</button>
    <span class="lightbox-counter" id="lightbox-counter">1 / 1</span>
    <button class="lightbox-btn" id="next">Siguiente →</button>
  </div>
</div>

<script>
const PROJECT_ID = '32sykluw';
const DATASET    = 'production';
const API_VER    = '2024-01-01';

function imgUrl(ref, w = 1200) {
  const [, id, dim, fmt] = ref.split('-');
  return `https://cdn.sanity.io/images/${PROJECT_ID}/${DATASET}/${id}-${dim}.${fmt}?w=${w}&auto=format`;
}

/* Lightbox */
let images = [], currentIndex = 0;
const lightbox    = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const counter     = document.getElementById('lightbox-counter');

function openLightbox(i) {
  currentIndex = i;
  lightbox.style.display = 'flex';
  setTimeout(() => lightbox.classList.add('show'), 10);
  updateLightbox();
}
function closeLightbox() {
  lightbox.classList.remove('show');
  setTimeout(() => lightbox.style.display = 'none', 300);
}
function updateLightbox() {
  lightboxImg.src = images[currentIndex];
  counter.textContent = `${currentIndex + 1} / ${images.length}`;
  document.querySelectorAll('.mini-gallery img').forEach((img, i) =>
    img.classList.toggle('active', i === currentIndex));
}

document.getElementById('close-btn').onclick = closeLightbox;
lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + images.length) % images.length; updateLightbox(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % images.length; updateLightbox(); };
document.addEventListener('keydown', e => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});

/* Cargar datos desde Sanity */
async function loadPost() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { document.getElementById('loading').textContent = 'Proyecto no encontrado.'; return; }

  const query = encodeURIComponent(`*[_type == "proyecto" && _id == "${id}"][0]{ title, location, year, description, features, tags, portada, galeria, precio, disponible }`);
  const res  = await fetch(`https://${PROJECT_ID}.api.sanity.io/v${API_VER}/data/query/${DATASET}?query=${query}`);
  const { result } = await res.json();

  if (!result) { document.getElementById('loading').textContent = 'Proyecto no encontrado.'; return; }

  document.title = `${result.title} - PORTICO LAB`;

  document.getElementById('post-title').textContent       = result.title || '';
  document.getElementById('post-location').textContent    = result.location || '';
  document.getElementById('post-year').textContent        = result.year || '';
  document.getElementById('post-description').textContent = result.description || '';

  if (result.features?.length) {
    document.getElementById('post-features').innerHTML =
      result.features.map(f => `<li>${f}</li>`).join('');
  }

  if (result.tags?.length) {
    document.getElementById('post-tags').innerHTML =
      result.tags.map(t => `<span class="tag">#${t}</span>`).join('');
  }

  if (result.precio) {
    const badge = document.getElementById('precio-badge');
    const dot = document.getElementById('disponible-dot');
    badge.style.display = 'inline-flex';
    document.getElementById('precio-valor').textContent =
      '$ ' + result.precio.toLocaleString('es-CO') + ' COP';
    dot.className = result.disponible ? 'disponible-dot' : 'no-disponible-dot';
    dot.title = result.disponible ? 'Disponible' : 'No disponible';
  }

  // Imágenes
  const allImages = [];
  if (result.portada?.asset?._ref) allImages.push(result.portada.asset._ref);
  (result.galeria || []).forEach(img => { if (img.asset?._ref) allImages.push(img.asset._ref); });

  images = allImages.map(ref => imgUrl(ref, 1200));

  const mainImg = document.getElementById('main-image');
  if (images.length > 0) {
    mainImg.src = images[0];
    mainImg.onclick = () => openLightbox(0);
  }

  const miniGallery = document.getElementById('mini-gallery');
  allImages.forEach((ref, i) => {
    const thumb = document.createElement('img');
    thumb.src = imgUrl(ref, 200);
    thumb.loading = 'lazy';
    if (i === 0) thumb.classList.add('active');
    thumb.onclick = () => {
      mainImg.src = images[i];
      currentIndex = i;
      document.querySelectorAll('.mini-gallery img').forEach((el, j) =>
        el.classList.toggle('active', j === i));
    };
    miniGallery.appendChild(thumb);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'grid';
}

loadPost();
</script>

<script src="../mascota.js"></script>
</body>
</html>
