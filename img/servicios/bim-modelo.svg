<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="t d"><title id="t">Modelo arquitectónico coordinado</title><desc id="d">Axonometría de edificio con niveles, ejes, nodos y lectura de datos de proyecto.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#dce0ee"/><stop offset=".48" stop-color="#9d8aff"/><stop offset="1" stop-color="#66e4fa"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8c8c9c" stroke-opacity=".16"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="900" height="760" fill="#08080b"/><rect width="900" height="760" fill="url(#grid)"/><g fill="none" stroke="#5f626c" stroke-width="2"><path d="M90 610 430 415 790 620 450 720Z"/><path d="M90 610v-90l340-196 360 206v90"/><path d="m170 564 340 195m-235-245 340 196m-235-245 340 196M90 550l360 206m-305-237 360 206m-250-270 360 206"/></g><g class="bim-structure" fill="none" stroke="url(#g)" stroke-width="4"><path d="m235 500 0-200 215-124 215 124v200M235 300l215 124 215-124M450 424v-248M235 400l215 124 215-124M235 300l215-124 215 124M290 468V268m105 261V329m110 198V329m105 139V268"/><path d="M290 268 505 392m0-124L290 392m-55-92 215 124m0-124-215 124"/></g><g fill="#101116" stroke="#ddd9ff" stroke-width="2"><circle class="node node-a" cx="235" cy="300" r="8"/><circle class="node node-b" cx="450" cy="176" r="8"/><circle class="node node-c" cx="665" cy="300" r="8"/><circle class="node node-d" cx="450" cy="424" r="8"/></g><path class="bim-scan" d="M180 354h540" stroke="#7ee8ff" stroke-width="2" stroke-dasharray="10 12"/><g fill="#d9d9e2" font-family="Montserrat, sans-serif" font-size="15" letter-spacing="2"><text x="78" y="92">MODELO COORDINADO / 05D</text><text x="578" y="672">COSTO · TIEMPO · GEOMETRÍA</text><text x="80" y="682" fill="#888">PLANTA / NIVEL 03</text></g><style>@media(prefers-reduced-motion:no-preference){.bim-scan{animation:scan 5s ease-in-out infinite}.bim-structure{animation:breath 7s ease-in-out infinite}.node{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.node-b{animation-delay:.4s}.node-c{animation-delay:.8s}.node-d{animation-delay:1.2s}}@keyframes scan{0%,100%{transform:translateY(-100px);opacity:.2}50%{transform:translateY(120px);opacity:1}}@keyframes breath{50%{opacity:.55}}@keyframes pulse{50%{r:13;fill:#7ee8ff}}</style></svg>
