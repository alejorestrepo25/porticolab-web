<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Edificio BIM despiezado por niveles</title>
  <desc id="desc">Axonometría explotada de un edificio de cuatro niveles: losas, columnas, núcleo y cubierta separados verticalmente, con datos de geometría, costo y cronograma coordinados en BIM.</desc>
  <defs>
    <pattern id="grid-b" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8c8c9c" stroke-opacity=".15"/></pattern>
    <linearGradient id="beam-b" x2="1" y2="1"><stop stop-color="#dce0ee"/><stop offset=".48" stop-color="#9d8aff"/><stop offset="1" stop-color="#66e4fa"/></linearGradient>
    <linearGradient id="slab-b" x2=".9" y2="1"><stop stop-color="#24232d"/><stop offset="1" stop-color="#12131a"/></linearGradient>
  </defs>
  <rect width="900" height="760" fill="#08080b"/><rect width="900" height="760" fill="url(#grid-b)"/>
  <text x="62" y="70" fill="#bbb" font-family="monospace" font-size="15" letter-spacing="2">PÓRTICO LAB / COORDINACIÓN BIM</text>

  <!-- Ejes guía: muestran que las piezas separadas pertenecen al mismo edificio. -->
  <g fill="none" stroke="#66e4fa" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="5 8">
    <path d="M190 185v396M310 116v397M430 185v396M550 255v396M250 220v396M370 151v396M490 220v396"/>
  </g>

  <!-- Núcleo vertical por tramos, alineado con las plantas. -->
  <g class="b-core" fill="none" stroke="url(#beam-b)" stroke-width="3">
    <path d="m310 375 60 34v46l-60 35-60-35v-46z"/><path d="m250 409 60 35 60-35M310 444v46"/>
    <path d="m310 293 60 34v46l-60 35-60-35v-46z"/><path d="m250 327 60 35 60-35M310 362v46"/>
    <path d="m310 211 60 34v46l-60 35-60-35v-46z"/><path d="m250 245 60 35 60-35M310 280v46"/>
    <path d="m310 129 60 34v46l-60 35-60-35v-46z"/><path d="m250 163 60 35 60-35M310 198v46"/>
  </g>

  <!-- Nivel 01: losa base y estructura perimetral. -->
  <g class="b-level b-level-1">
    <path d="m190 581 180-104 180 104-180 104z" fill="url(#slab-b)" stroke="url(#beam-b)" stroke-width="3"/>
    <path d="m190 581v13l180 104v-13m180-104v13L370 698v-13" fill="#101116" stroke="#8e85c7" stroke-width="2"/>
    <path d="M250 546v-88m120 19v-88m120 157v-88M250 458l120-69 120 69m-240 0 120 69 120-69" fill="none" stroke="url(#beam-b)" stroke-width="4"/>
    <path d="m250 458 120-69 120 69v88m-240-88 120 69 120-69m-180 34v-69m120 103v-69" fill="none" stroke="#c9c3ed" stroke-opacity=".78" stroke-width="2"/>
  </g>

  <!-- Nivel 02: placa de entrepiso separada; fachada ligera y columnas legibles. -->
  <g class="b-level b-level-2">
    <path d="m190 499 180-104 180 104-180 104z" fill="url(#slab-b)" stroke="url(#beam-b)" stroke-width="3"/>
    <path d="m190 499v12l180 104v-12m180-104v12L370 615v-12" fill="#101116" stroke="#8e85c7" stroke-width="2"/>
    <path d="M250 458v-88m120 19v-88m120 157v-88M250 370l120-69 120 69m-240 0 120 69 120-69" fill="none" stroke="url(#beam-b)" stroke-width="4"/>
    <path d="m250 370 120-69 120 69v88m-240-88 120 69 120-69m-180 34v-69m120 103v-69" fill="none" stroke="#c9c3ed" stroke-opacity=".78" stroke-width="2"/>
    <path d="m274 384 96-55 96 55m-192 0v48m96-103v54m96-54v54m-192 0 96 55 96-55" fill="none" stroke="#66e4fa" stroke-opacity=".62" stroke-width="1.5"/>
  </g>

  <!-- Nivel 03. -->
  <g class="b-level b-level-3">
    <path d="m190 417 180-104 180 104-180 104z" fill="url(#slab-b)" stroke="url(#beam-b)" stroke-width="3"/>
    <path d="m190 417v12l180 104v-12m180-104v12L370 533v-12" fill="#101116" stroke="#8e85c7" stroke-width="2"/>
    <path d="M250 370v-88m120 19v-88m120 157v-88M250 282l120-69 120 69m-240 0 120 69 120-69" fill="none" stroke="url(#beam-b)" stroke-width="4"/>
    <path d="m250 282 120-69 120 69v88m-240-88 120 69 120-69m-180 34v-69m120 103v-69" fill="none" stroke="#c9c3ed" stroke-opacity=".78" stroke-width="2"/>
    <path d="m274 296 96-55 96 55m-192 0v48m96-103v54m96-54v54m-192 0 96 55 96-55" fill="none" stroke="#66e4fa" stroke-opacity=".62" stroke-width="1.5"/>
  </g>

  <!-- Nivel 04. -->
  <g class="b-level b-level-4">
    <path d="m190 335 180-104 180 104-180 104z" fill="url(#slab-b)" stroke="url(#beam-b)" stroke-width="3"/>
    <path d="m190 335v12l180 104v-12m180-104v12L370 451v-12" fill="#101116" stroke="#8e85c7" stroke-width="2"/>
    <path d="M250 282v-88m120 19v-88m120 157v-88M250 194l120-69 120 69m-240 0 120 69 120-69" fill="none" stroke="url(#beam-b)" stroke-width="4"/>
    <path d="m250 194 120-69 120 69v88m-240-88 120 69 120-69m-180 34v-69m120 103v-69" fill="none" stroke="#c9c3ed" stroke-opacity=".78" stroke-width="2"/>
    <path d="m274 208 96-55 96 55m-192 0v48m96-103v54m96-54v54m-192 0 96 55 96-55" fill="none" stroke="#66e4fa" stroke-opacity=".62" stroke-width="1.5"/>
  </g>

  <!-- Cubierta desprendida: remate inequívoco del edificio. -->
  <g class="b-roof">
    <path d="m190 253 180-104 180 104-180 104z" fill="#171720" stroke="url(#beam-b)" stroke-width="3"/>
    <path d="m190 253 180 104 180-104M250 218l120 69 120-69" fill="none" stroke="#b7a9ff" stroke-opacity=".75" stroke-width="2"/>
    <path d="M190 253v10l180 104v-10m180-104v10L370 367v-10" fill="#101116" stroke="#8e85c7" stroke-width="2"/>
  </g>

  <!-- Etiquetas de nivel y conectores BIM. -->
  <g fill="#9b9ba8" font-family="monospace" font-size="10" letter-spacing="1.2">
    <text x="106" y="590">NIVEL 01</text><text x="106" y="508">NIVEL 02</text><text x="106" y="426">NIVEL 03</text><text x="106" y="344">NIVEL 04</text><text x="106" y="262" fill="#7ee8ff">CUBIERTA</text>
  </g>
  <g fill="none" stroke="#66e4fa" stroke-opacity=".58" stroke-width="1.5">
    <path d="M550 253h18v-26h25M550 417h18v-1h25M550 581h18v27h25"/>
  </g>
  <g class="b-panel">
    <rect x="605" y="174" width="232" height="378" rx="12" fill="#0b0b10" stroke="#373642"/>
    <text x="628" y="210" fill="#d8d5e6" font-family="monospace" font-size="13" letter-spacing="1.5">CONTROL BIM</text>
    <g class="b-row b-row-1"><rect x="622" y="235" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="260" r="6" fill="#7ee8ff"/><text x="662" y="264" fill="#eee" font-family="monospace" font-size="12">GEOMETRÍA</text><text x="644" y="289" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">NIVELES COORDINADOS</text></g>
    <g class="b-row b-row-2"><rect x="622" y="326" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="351" r="6" fill="#b9a7ff"/><text x="662" y="355" fill="#eee" font-family="monospace" font-size="12">COSTO · 5D</text><text x="644" y="380" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">CANTIDADES POR NIVEL</text></g>
    <g class="b-row b-row-3"><rect x="622" y="417" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="442" r="6" fill="#7ee8ff"/><text x="662" y="446" fill="#eee" font-family="monospace" font-size="12">CRONOGRAMA</text><text x="644" y="471" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">SECUENCIA DE OBRA</text></g>
  </g>
  <text x="62" y="682" fill="#92929d" font-family="monospace" font-size="12" letter-spacing="1.5">EDIFICIO DESPIEZADO · NIVELES COORDINADOS</text>
  <text x="614" y="598" fill="#85858f" font-family="monospace" font-size="11" letter-spacing="1">DISEÑO / COORDINACIÓN / OBRA</text>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .b-level-1{animation:level-float 8s ease-in-out infinite;animation-delay:.16s}
      .b-level-2{animation:level-float 8s ease-in-out infinite;animation-delay:.12s}
      .b-level-3{animation:level-float 8s ease-in-out infinite;animation-delay:.08s}
      .b-level-4{animation:level-float 8s ease-in-out infinite;animation-delay:.04s}
      .b-roof{animation:level-float 8s ease-in-out infinite}
      .b-scan{animation:b-scan 6s ease-in-out infinite}
      .b-row-1{animation:b-row-one 8s ease-in-out infinite}
      .b-row-2{animation:b-row-two 8s ease-in-out infinite}
      .b-row-3{animation:b-row-three 8s ease-in-out infinite}
    }
    @keyframes level-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes b-scan{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes b-row-one{0%,10%,34%,88%,100%{opacity:.55}18%,28%{opacity:1}}
    @keyframes b-row-two{0%,30%,54%,88%,100%{opacity:.55}38%,48%{opacity:1}}
    @keyframes b-row-three{0%,50%,74%,88%,100%{opacity:.55}58%,68%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.b-level,.b-roof,.b-row{animation:none!important;opacity:1}}
  </style>
</svg>
