<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Coordinación BIM y control del proyecto</title>
  <desc id="desc">Un modelo arquitectónico se conecta con geometría, costos y cronograma en una misma lectura de proyecto.</desc>
  <defs>
    <pattern id="grid-b" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8c8c9c" stroke-opacity=".15"/></pattern>
    <linearGradient id="beam-b" x2="1" y2="1"><stop stop-color="#dce0ee"/><stop offset=".48" stop-color="#9d8aff"/><stop offset="1" stop-color="#66e4fa"/></linearGradient>
  </defs>
  <rect width="900" height="760" fill="#08080b"/><rect width="900" height="760" fill="url(#grid-b)"/>
  <text x="62" y="82" fill="#bbb" font-family="monospace" font-size="15" letter-spacing="2">PÓRTICO LAB / COORDINACIÓN BIM</text>
  <g fill="none" stroke="#50515d" stroke-width="2">
    <path d="m72 586 260-150 270 155-260 150z"/><path d="M112 563v-70l220-127 230 132v70M172 528l220 132m-120-216 230 132m-120-216 230 132"/>
  </g>
  <g class="b-model" fill="none" stroke="url(#beam-b)" stroke-width="4" stroke-linejoin="round">
    <path d="m154 493 0-170 178-103 178 103v170M154 323l178 103 178-103M332 426V220M154 408l178 103 178-103M154 323l178-103 178 103"/>
    <path d="m199 467 0-170 178-103v170m-178-67 178 103m-178-103 178-103M243 441V271m89 206V323m89 154V271" stroke-width="3"/>
    <path d="m154 408 89-52 89 52 89-52 89 52M154 323l89-52 89 52 89-52 89 52" stroke-width="2" opacity=".72"/>
  </g>
  <g class="b-nodes" fill="#08080b" stroke="#7ee8ff" stroke-width="3">
    <circle cx="154" cy="323" r="7"/><circle cx="332" cy="220" r="7"/><circle cx="510" cy="323" r="7"/><circle cx="332" cy="426" r="7"/>
  </g>
  <path class="b-scan" d="M125 365h410" stroke="#7ee8ff" stroke-width="2" stroke-dasharray="8 10"/>
  <path d="M525 323h52v-93h28m-80 196h52v-1h28m-80 75h52v94h28" fill="none" stroke="#7ee8ff" stroke-opacity=".48" stroke-width="2"/>
  <g class="b-panel">
    <rect x="605" y="174" width="232" height="378" rx="12" fill="#0b0b10" stroke="#373642"/>
    <text x="628" y="210" fill="#d8d5e6" font-family="monospace" font-size="13" letter-spacing="1.5">CONTROL BIM</text>
    <g class="b-row b-row-1"><rect x="622" y="235" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="260" r="6" fill="#7ee8ff"/><text x="662" y="264" fill="#eee" font-family="monospace" font-size="12">GEOMETRÍA</text><text x="644" y="289" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">VINCULADA AL MODELO</text></g>
    <g class="b-row b-row-2"><rect x="622" y="326" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="351" r="6" fill="#b9a7ff"/><text x="662" y="355" fill="#eee" font-family="monospace" font-size="12">COSTO · 5D</text><text x="644" y="380" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">VINCULADO AL MODELO</text></g>
    <g class="b-row b-row-3"><rect x="622" y="417" width="198" height="78" rx="7" fill="#111117" stroke="#282733"/><circle cx="645" cy="442" r="6" fill="#7ee8ff"/><text x="662" y="446" fill="#eee" font-family="monospace" font-size="12">CRONOGRAMA</text><text x="644" y="471" fill="#8c8c98" font-family="monospace" font-size="9" letter-spacing="1">VINCULADO AL MODELO</text></g>
  </g>
  <text x="62" y="682" fill="#92929d" font-family="monospace" font-size="12" letter-spacing="1.5">UN MODELO · DECISIONES CONECTADAS</text>
  <text x="614" y="598" fill="#85858f" font-family="monospace" font-size="11" letter-spacing="1">DISEÑO / COORDINACIÓN / OBRA</text>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .b-scan { animation:b-scan 8s cubic-bezier(.76,0,.24,1) infinite; }
      .b-model { animation:b-model 8s ease-in-out infinite; }
      .b-nodes { animation:b-nodes 8s ease-in-out infinite; }
      .b-row-1 { animation:b-row-one 8s ease-in-out infinite; }
      .b-row-2 { animation:b-row-two 8s ease-in-out infinite; }
      .b-row-3 { animation:b-row-three 8s ease-in-out infinite; }
    }
    @keyframes b-scan { 0%,10% { transform:translateY(-90px);opacity:.18 } 45%,75% { transform:translateY(130px);opacity:1 } 90%,100% { transform:translateY(-90px);opacity:.18 } }
    @keyframes b-model { 0%,12%,90%,100% { opacity:.62 } 42%,76% { opacity:1 } }
    @keyframes b-nodes { 0%,18%,90%,100% { opacity:.35 } 46%,76% { opacity:1 } }
    @keyframes b-row-one { 0%,10%,34%,88%,100% { opacity:.52 } 18%,28% { opacity:1 } }
    @keyframes b-row-two { 0%,30%,54%,88%,100% { opacity:.52 } 38%,48% { opacity:1 } }
    @keyframes b-row-three { 0%,50%,74%,88%,100% { opacity:.52 } 58%,68% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .b-scan { display:none } .b-model,.b-nodes,.b-panel,.b-row { opacity:1 } }
  </style>
</svg>
