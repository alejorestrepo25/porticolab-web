<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Modelo BIM coordinado de un edificio complejo</title>
  <desc id="desc">Vista axonométrica de un edificio abierto para mostrar distribución interior, atrio, escaleras, fachada acristalada y redes coordinadas de climatización, electricidad y datos junto a un panel de control BIM.</desc>
  <defs>
    <pattern id="grid-b" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8c8c9c" stroke-opacity=".15"/></pattern>
    <linearGradient id="beam-b" x2="1" y2="1"><stop stop-color="#dce0ee"/><stop offset=".48" stop-color="#9d8aff"/><stop offset="1" stop-color="#66e4fa"/></linearGradient>
    <linearGradient id="wall-b" x2="1" y2="1"><stop stop-color="#d9dbe0" stop-opacity=".9"/><stop offset="1" stop-color="#777b86" stop-opacity=".82"/></linearGradient>
    <linearGradient id="glass-b" x2="0" y2="1"><stop stop-color="#b8e5f0" stop-opacity=".48"/><stop offset="1" stop-color="#536a79" stop-opacity=".24"/></linearGradient>
    <clipPath id="slab-clip-b"><path d="m62 455 223-129 259 149-219 127z"/></clipPath>
    <filter id="soft-b"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="900" height="760" fill="#08080b"/><rect width="900" height="760" fill="url(#grid-b)"/>
  <text x="38" y="47" fill="#bbb" font-family="monospace" font-size="14" letter-spacing="1.7">PÓRTICO LAB / COORDINACIÓN BIM</text>

  <!-- Base topográfica y huella del edificio. -->
  <path d="m35 520 250-144 292 168-252 146z" fill="#111319" stroke="#4d505a" stroke-width="1.5"/>
  <path d="m62 520 223-128 259 149-219 127z" fill="#191a20" stroke="#777b85" stroke-width="2"/>
  <path d="m62 520 223-128 259 149-219 127z" fill="none" stroke="#7ee8ff" stroke-opacity=".22" stroke-width="14" filter="url(#soft-b)"/>

  <g class="dim-arq">
  <!-- Nivel inferior legible a través de fachada acristalada. -->
  <g class="b-lower">
    <path d="m62 520 223 128v34L62 554zM544 541 325 668v34l219-127z" fill="#22252d" stroke="#9ba2b1" stroke-width="2"/>
    <path d="m62 520 223 128v34L62 554z" fill="url(#glass-b)" stroke="#c8d6df" stroke-opacity=".8" stroke-width="2"/>
    <path d="m285 648 259-149v34L285 682z" fill="url(#glass-b)" stroke="#c8d6df" stroke-opacity=".8" stroke-width="2"/>
    <g fill="none" stroke="#d6dce4" stroke-opacity=".75" stroke-width="2">
      <path d="m105 545v34m44-9v34m44-9v34m44-9v34m48-1v34m52-64v34m52-64v34m52-64v34m52-64v34m52-64v34"/>
      <path d="m62 554 223 128 259-149" stroke-width="3"/>
    </g>
    <path d="m115 553 101 58v30m-42-73v30m84-1 48 28m36-49 85-49m-43 74 86-50" fill="none" stroke="#b9a7ff" stroke-opacity=".62" stroke-width="2"/>
  </g>

  <!-- Losa del nivel principal y cantos estructurales. -->
  <g class="b-slab">
  <path d="m62 455 223-129 259 149-219 127z" fill="#c8b89f" stroke="#f1eee7" stroke-width="2.5"/>
  <path d="m62 455 223 129v15L62 470zM544 475 325 604v-15l219-129z" fill="#626773" stroke="#aeb2bd" stroke-width="1.5"/>
  <path d="m62 455 223-129 259 149-219 127z" fill="none" stroke="#e6e9f2" stroke-opacity=".55" stroke-width="1"/>

  </g>
  <!-- Planta interior: espacios, divisiones y núcleo. -->
  <g class="b-walls" stroke-linejoin="round">
    <!-- Perímetro posterior y laterales, abierto hacia el observador. -->
    <path d="m62 455 0-110 223-129v110z" fill="url(#wall-b)" stroke="#e6e8ed" stroke-width="2"/>
    <path d="m285 326 259 149v-110L285 216z" fill="url(#wall-b)" fill-opacity=".82" stroke="#e6e8ed" stroke-width="2"/>
    <path d="m62 345 223 129v-8L62 337zM285 474l259-149v-8L285 466z" fill="#f1f2f4" stroke="#c9ccd3" stroke-width="1.5"/>
    <!-- Divisiones internas elevadas para mostrar habitaciones y circulaciones. -->
    <path d="m112 427 0-64 88-51v64z" fill="#aeb2bd" stroke="#f0f1f3" stroke-width="1.5"/>
    <path d="m112 363 88 51v-7l-88-51z" fill="#e2e4e8" stroke="#c7cad2" stroke-width="1"/>
    <path d="m200 376 0-70 8-5v79z" fill="#d8dae0" stroke="#f0f1f3" stroke-width="1.3"/>
    <path d="m208 380 59-34v-80l-59 34z" fill="#9196a2" stroke="#eceef2" stroke-width="1.5"/>
    <path d="m208 300 59 34v-8l-59-34z" fill="#dedfe4" stroke="#c7cad2" stroke-width="1"/>
    <path d="m368 485 0-83 10-6v95z" fill="#d5d7dd" stroke="#f2f3f5" stroke-width="1.5"/>
    <path d="m378 491 77-45v-89l-77 45z" fill="#a2a6b1" stroke="#f2f3f5" stroke-width="1.5"/>
    <path d="m378 402 77 45v-8l-77-45z" fill="#e0e2e7" stroke="#c7cad2" stroke-width="1"/>
    <path d="m455 446 0-82 9-5v92z" fill="#d3d5dc" stroke="#f2f3f5" stroke-width="1.4"/>
    <path d="m132 496 0-52 7-4v60m83 48v-71l8-5v81m168-29v-58l8-5v68" fill="#b8bbc4" stroke="#f0f1f3" stroke-width="1.3"/>
    <!-- Puertas y marcos. -->
    <g fill="none" stroke="#555b68" stroke-width="2"><path d="m112 397 23 13v28m0-28 20-12m-20 12v28m73-113 21 12v23m0-23 18-11m-18 11v24m160 86 24 14v29m0-29 22-13m-22 13v29m45-76 20 12v25m0-25 17-10m-17 10v25"/></g>
    <!-- Mesones y mobiliario de referencia a escala humana. -->
    <g fill="#e7e9ed" stroke="#7d838f" stroke-width="1.2"><path d="m82 419 37-21 29 17-37 22z"/><path d="m82 419v10l29 17v-9m37-22v10l-37 21v-9" fill="#aeb5bf"/><path d="m157 462 31-18 26 15-31 18z"/><path d="m157 462v8l26 15v-8m31-18v8l-31 18v-8" fill="#aeb5bf"/><path d="m466 480 32-18 22 13-32 19z"/><path d="m466 480v8l22 14v-8m32-19v8l-32 19v-8" fill="#aeb5bf"/></g>
  </g>

  <!-- Atrio central circular con doble anillo y baranda. -->
  <g class="b-atrium">
    <ellipse cx="311" cy="422" rx="66" ry="36" fill="#222630" stroke="#6f7784" stroke-width="2"/>
    <ellipse cx="311" cy="415" rx="66" ry="36" fill="#090b11" stroke="#cfd5df" stroke-width="3"/>
    <ellipse cx="311" cy="415" rx="58" ry="30" fill="#11141c" stroke="#7ee8ff" stroke-opacity=".64" stroke-width="1.5"/>
    <path d="M245 415v-34m132 34v-34M260 390v-34m102 34v-34" fill="none" stroke="#aeb5c1" stroke-width="2"/>
    <ellipse cx="311" cy="381" rx="58" ry="30" fill="none" stroke="#d3d7e0" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M267 407q44-24 88 0" fill="none" stroke="#b9a7ff" stroke-opacity=".75" stroke-width="2"/>
  </g>

  <!-- Escaleras y descansos. -->
  <g fill="none" stroke="#58606e" stroke-width="2">
    <path d="m70 397 46-27 27 16-46 27zM73 390l46 27m-39-35 46 27m-39-35 46 27m-39-35 46 27m-39-35 46 27"/>
    <path d="m435 519 48-28 25 15-48 28zM438 511l48 28m-40-33 48 28m-40-33 48 28m-40-33 48 28m-40-33 48 28"/>
  </g>

  </g>
  <!-- Trazados MEP: conductos, bandejas eléctricas, rociadores y ramales. -->
  <g class="dim-mep"><g class="b-mep" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Climatización -->
    <path class="mep-run mep-1" pathLength="100" d="m82 360 58-34 33 19 53-31 37 21 45-26 30 17 45-26 57 33 62-36" stroke="#fa68bc" stroke-width="7"/>
    <path d="m141 326v34m65-46v31m99-37v47m92-73v43m86-8v42" stroke="#ffb5e1" stroke-width="2"/>
    <path d="m169 346 0 28m128-65v22m112-51v22m84 2v29" stroke="#ed5cae" stroke-width="4"/>
    <!-- Tuberías hidráulicas -->
    <path class="mep-run mep-2" pathLength="100" d="m95 379 63 37 44-25 43 25 40-23m36 1 51 30 42-24 47 27 52-30" stroke="#77d98c" stroke-width="5"/>
    <path d="m202 391v-35m84 49v-32m137 18v-37m93 19v-36" stroke="#a1f2ae" stroke-width="2"/>
    <!-- Bandejas eléctricas y datos -->
    <path class="mep-run mep-3" pathLength="100" d="m77 383 52-30 43 25 52-30 37 21 48-28 48 28 41-24 48 28 44-25 52 30" stroke="#f4c95d" stroke-width="4"/>
    <path d="m126 354v-30m126 15v-27m106 37v-29m111 37v-26" stroke="#f4c95d" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- Drenajes y conexiones -->
    <path d="m110 445 57-33 45 26 48-28m83 48 52-30 51 29 39-23" stroke="#58b8e9" stroke-width="3" stroke-dasharray="6 5"/>
    <g fill="#ff8b63" stroke="none"><circle cx="173" cy="379" r="4"/><circle cx="297" cy="343" r="4"/><circle cx="411" cy="324" r="4"/><circle cx="473" cy="370" r="4"/></g>
  </g>

  </g>
  <!-- Columnas, cerramiento cortina y montantes de fachada. -->
  <g class="dim-arq"><g class="b-cols" fill="none" stroke="#d7dce4" stroke-width="3">
    <path d="M92 472v41m64-4v41m64-4v41m64-4v41m69-80v40m64-78v40m64-78v40m64-78v40"/>
    <path d="m62 455 223 129 259-149" stroke="#f1f3f7" stroke-width="3"/>
  </g>
  </g>
  <g class="b-nodes" fill="#7ee8ff" stroke="#08080b" stroke-width="2"><circle cx="285" cy="326" r="5"/><circle cx="544" cy="475" r="5"/><circle cx="325" cy="604" r="5"/></g>

  <!-- Superposición COSTO 5D: una barrida mide la losa y los nodos emiten ondas. -->
  <g class="ov-cost" fill="none">
    <g clip-path="url(#slab-clip-b)"><path class="scan" d="m62 455 223-129 26 15-223 129z" fill="#7ee8ff" fill-opacity=".34"/></g>
    <g stroke="#7ee8ff" stroke-width="2">
      <circle class="ripple r1" cx="285" cy="326" r="10"/><circle class="ripple r2" cx="544" cy="475" r="10"/><circle class="ripple r3" cx="325" cy="604" r="10"/>
    </g>
  </g>
  <!-- Superposición SECUENCIA: niveles de abajo hacia arriba. -->
  <g class="ov-seq" fill="none" stroke="#77d98c" stroke-width="3.5" stroke-linejoin="round">
    <path class="sq1" d="m62 520 223 128 259-149" />
    <path class="sq2" d="m62 455 223 129 259-149-221-127z"/>
    <path class="sq3" d="m62 345 223-129 259 149"/>
  </g>
  <!-- Panel de coordinación: información asociada a los elementos visibles. -->
  <g class="b-panel-wrap"><g class="b-panel">
    <rect x="620" y="111" width="244" height="474" rx="13" fill="#0b0b10" fill-opacity=".96" stroke="#373642"/>
    <text x="641" y="145" fill="#d8d5e6" font-family="monospace" font-size="14" letter-spacing="1.3">MODELO COORDINADO</text>
    <text x="641" y="165" fill="#85858f" font-family="monospace" font-size="11" letter-spacing="1">ARQUITECTURA + MEP</text>
    <g class="b-row b-row-1" style="--c:#b9a7ff"><rect x="638" y="188" width="208" height="76" rx="7" fill="#111117" stroke="#282733"/><circle cx="658" cy="211" r="5" fill="#b9a7ff"/><text x="674" y="215" fill="#eee" font-family="monospace" font-size="13">ARQUITECTURA</text><text x="653" y="242" fill="#8c8c98" font-family="monospace" font-size="11">ESPACIOS · FACHADA · NIVELES</text></g>
    <g class="b-row b-row-2" style="--c:#fa68bc"><rect x="638" y="276" width="208" height="76" rx="7" fill="#111117" stroke="#282733"/><circle cx="658" cy="299" r="5" fill="#fa68bc"/><text x="674" y="303" fill="#eee" font-family="monospace" font-size="13">INSTALACIONES</text><text x="653" y="330" fill="#8c8c98" font-family="monospace" font-size="11">HVAC · HIDRÁULICA · ELÉCTRICA</text></g>
    <g class="b-row b-row-3" style="--c:#7ee8ff"><rect x="638" y="364" width="208" height="76" rx="7" fill="#111117" stroke="#282733"/><circle cx="658" cy="387" r="5" fill="#7ee8ff"/><text x="674" y="391" fill="#eee" font-family="monospace" font-size="13">COSTO · 5D</text><text x="653" y="418" fill="#8c8c98" font-family="monospace" font-size="11">CANTIDADES POR ELEMENTO</text></g>
    <g class="b-row b-row-4" style="--c:#77d98c"><rect x="638" y="452" width="208" height="76" rx="7" fill="#111117" stroke="#282733"/><circle cx="658" cy="475" r="5" fill="#77d98c"/><text x="674" y="479" fill="#eee" font-family="monospace" font-size="13">SECUENCIA</text><text x="653" y="506" fill="#8c8c98" font-family="monospace" font-size="11">PLANIFICACIÓN DE OBRA</text></g>
    <path d="M638 548h208" stroke="#292933"/>
    <text x="641" y="568" fill="#7ee8ff" font-family="monospace" font-size="10.5" letter-spacing=".6">COLISIONES / DATOS / DECISIONES</text>
  </g></g>
  <text x="38" y="727" fill="#92929d" font-family="monospace" font-size="13" letter-spacing="1.3">MODELO ABIERTO · ESPACIOS + SISTEMAS + ENVOLVENTE</text>

  <style>
    /* Coreografía: entrada única (≈3,4 s) y luego un ciclo de 12 s que aísla cada capa del modelo, en sincronía con el panel.
       Ciclo = ARQUITECTURA 0–25 % · INSTALACIONES 25–50 % · COSTO 5D 50–75 % · SECUENCIA 75–100 %. */
    .mep-run{stroke-dasharray:100}
    @media(prefers-reduced-motion:no-preference){
      /* — entrada: el edificio se construye de abajo hacia arriba y luego llegan las redes y el panel — */
      .b-lower{animation:rise .8s cubic-bezier(.16,1,.3,1) .15s both}
      .b-slab{animation:rise .8s cubic-bezier(.16,1,.3,1) .5s both}
      .b-walls{animation:grow 1s cubic-bezier(.16,1,.3,1) .8s both}
      .b-atrium{animation:rise .7s cubic-bezier(.16,1,.3,1) 1.35s both}
      .b-cols{animation:fade .8s ease-out 1.5s both}
      .mep-1{animation:draw 1.1s cubic-bezier(.4,0,.2,1) 1.9s both}
      .mep-2{animation:draw 1.1s cubic-bezier(.4,0,.2,1) 2.2s both}
      .mep-3{animation:draw 1.1s cubic-bezier(.4,0,.2,1) 2.5s both}
      .b-mep path:not(.mep-run){animation:fade .8s ease-out 2.9s both}
      .b-mep circle{animation:fade .8s ease-out 3s both}
      .b-nodes{animation:fade .6s ease-out 3.1s both}
      .b-panel-wrap{animation:slide .8s cubic-bezier(.16,1,.3,1) 1.2s both}
      .b-row-1{animation:slide .7s cubic-bezier(.16,1,.3,1) 1.6s both}
      .b-row-2{animation:slide .7s cubic-bezier(.16,1,.3,1) 1.75s both}
      .b-row-3{animation:slide .7s cubic-bezier(.16,1,.3,1) 1.9s both}
      .b-row-4{animation:slide .7s cubic-bezier(.16,1,.3,1) 2.05s both}
      /* — ciclo de aislamiento por capas — */
      .dim-arq{animation:dim-arq 12s linear 3.6s infinite}
      .dim-mep{animation:dim-mep 12s linear 3.6s infinite}
      .ov-cost{animation:ov-cost 12s linear 3.6s infinite;opacity:0}
      .ov-seq{opacity:1}
      .scan{animation:scan 12s cubic-bezier(.4,0,.2,1) 3.6s infinite}
      .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 1.9s ease-out 3.6s infinite}
      .r2{animation-delay:4.2s}.r3{animation-delay:4.8s}
      .sq1,.sq2,.sq3{opacity:0}
      .sq1{animation:seq 12s linear 3.6s infinite;--a:76%;--b:84%}
      .sq2{animation:seq2 12s linear 3.6s infinite}
      .sq3{animation:seq3 12s linear 3.6s infinite}
      .b-row rect{transition:none}
      .b-row-1 rect{animation:act 12s linear 3.6s infinite}
      .b-row-2 rect{animation:act 12s linear 6.6s infinite}
      .b-row-3 rect{animation:act 12s linear 9.6s infinite}
      .b-row-4 rect{animation:act 12s linear 12.6s infinite}
      .b-atrium ellipse:last-of-type{animation:ring 14s linear infinite;transform-origin:311px 381px}
    }
    @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
    @keyframes grow{from{opacity:0;clip-path:inset(100% 0 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
    @keyframes dim-arq{0%,22%{opacity:1}27%,47%{opacity:.28}52%,72%{opacity:.45}77%,96%{opacity:.62}100%{opacity:1}}
    @keyframes dim-mep{0%{opacity:1}4%,22%{opacity:.25}27%,47%{opacity:1}52%,72%{opacity:.34}77%,96%{opacity:.18}100%{opacity:1}}
    @keyframes ov-cost{0%,48%{opacity:0}53%,72%{opacity:1}77%,100%{opacity:0}}
    @keyframes scan{0%,50%{transform:translate(-30px,-18px)}72%,100%{transform:translate(262px,152px)}}
    @keyframes ripple{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(3.4)}}
    @keyframes seq{0%,75%{opacity:0}78%,82%{opacity:1}86%,100%{opacity:.35}}
    @keyframes seq2{0%,81%{opacity:0}84%,88%{opacity:1}92%,100%{opacity:.35}}
    @keyframes seq3{0%,87%{opacity:0}90%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes act{0%,22%{stroke:var(--c);fill:#1a1924}27%,100%{stroke:#282733;fill:#111117}}
    @keyframes ring{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.b-row-1,.b-row-2,.b-row-3,.b-row-4,.dim-arq,.dim-mep{animation:none!important;opacity:1}.ov-cost,.sq1,.sq2,.sq3{opacity:0}}
  </style>
</svg>
