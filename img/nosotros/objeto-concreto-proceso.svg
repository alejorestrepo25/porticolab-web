<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Desmolde en concreto</title><desc id="d">El molde se separa en dos mitades y deja ver la pieza de concreto en forma de escalera.</desc>
