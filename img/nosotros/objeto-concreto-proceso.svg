<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Desmolde en concreto</title><desc id="d">El molde se separa en dos mitades y deja ver la pieza de concreto en forma de escalera.</desc>
<defs>
<radialGradient id="fondo" cx=".5" cy=".38" r=".75"><stop stop-color="#1c1c22"/><stop offset="1" stop-color="#0d0d10"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd6e4" stop-opacity=".22"/></linearGradient>
<linearGradient id="molde" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd3dc" stop-opacity=".30"/><stop offset="1" stop-color="#7fd3dc" stop-opacity=".14"/></linearGradient>
<pattern id="tablas" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8a467"/><path d="M0 9.5H10" stroke="#9c6a35" stroke-opacity=".55"/></pattern>
</defs>
<style>

@keyframes moldeA{0%,28%{transform:none;opacity:1}50%,82%{transform:translate(-66.7px,-38.5px);opacity:1}90%{opacity:0}94%,100%{transform:none;opacity:0}}
@keyframes moldeB{0%,28%{transform:none;opacity:1}50%,82%{transform:translate(66.7px,38.5px);opacity:1}90%{opacity:0}94%,100%{transform:none;opacity:0}}
@keyframes pieza{0%,18%{opacity:.25}40%,92%{opacity:1}97%,100%{opacity:.25}}
@keyframes flecha{0%,30%{opacity:0}38%,70%{opacity:1}80%,100%{opacity:0}}
@keyframes entra{0%{opacity:0}6%,100%{opacity:1}}
.moldeA{animation:moldeA 8s cubic-bezier(.5,0,.2,1) infinite}
.moldeB{animation:moldeB 8s cubic-bezier(.5,0,.2,1) infinite}
.pieza{animation:pieza 8s ease-in-out infinite}
.flecha{animation:flecha 8s ease-in-out infinite}
@keyframes paso1{0%,5%{opacity:.38}9%,28%{opacity:1}32%,100%{opacity:.38}}
.paso1{animation:paso1 8s ease-in-out infinite;opacity:.38}
@keyframes paso2{0%,29%{opacity:.38}33%,54%{opacity:1}58%,100%{opacity:.38}}
.paso2{animation:paso2 8s ease-in-out infinite;opacity:.38}
@keyframes paso3{0%,55%{opacity:.38}59%,90%{opacity:1}94%,100%{opacity:.38}}
.paso3{animation:paso3 8s ease-in-out infinite;opacity:.38}
.en-pausa *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
