  <title id="title">Desmolde de una ménsula escalonada en concreto</title>
  <desc id="desc">Se vierte concreto en un molde de silicona translúcido, se vibra y cura, y las dos mitades del molde se abren para revelar una ménsula escalonada con textura de áridos.</desc>
