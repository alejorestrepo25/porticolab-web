<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">Desmolde de una ménsula arquitectónica en concreto</title>
  <desc id="desc">Las mitades de un molde flexible se abren para revelar una ménsula de concreto con perfiles y detalles moldeados.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#777" stroke-opacity=".15"/></pattern>
    <linearGradient id="cast" x2="1" y2="1"><stop stop-color="#e4e0d8"/><stop offset="1" stop-color="#777a84"/></linearGradient>
    <linearGradient id="mold" x2="0" y2="1"><stop stop-color="#393942"/><stop offset="1" stop-color="#17171c"/></linearGradient>
  </defs>
  <rect width="640" height="500" fill="#09090c"/><rect width="640" height="500" fill="url(#grid)"/>
  <path d="M174 396h292m-254 16h216" stroke="#777" stroke-opacity=".5" stroke-width="3"/>
  <path class="piece" d="M252 352v-48q0-17 17-17h28v-44q0-18 18-18h78v40h-40v72q0 15-16 15z" fill="url(#cast)" stroke="#eeece8" stroke-width="3" stroke-linejoin="round"/>
  <path class="piece-detail" d="M269 335v-31q0-10 10-10h35v-50m20 1v51h42v-43m-84 83h56" fill="none" stroke="#4a4b52" stroke-opacity=".7" stroke-width="4"/>
  <g class="mold mold-left" fill="url(#mold)" stroke="#b9a7ff" stroke-width="3" stroke-linejoin="round"><path d="M229 251q-25 17-24 51l4 77q2 18 19 18h38l8-38-2-97q-21-21-43-11z"/><path d="M227 273v101m26-116-2 125" fill="none" stroke="#696873" stroke-width="2"/></g>
  <g class="mold mold-right" fill="url(#mold)" stroke="#b9a7ff" stroke-width="3" stroke-linejoin="round"><path d="M426 251q25 17 24 51l-4 77q-2 18-19 18h-38l-8-38 2-97q21-21 43-11z"/><path d="M428 273v101m-26-116 2 125" fill="none" stroke="#696873" stroke-width="2"/></g>
  <path class="arrow arrow-left" d="m218 222-28 0m0 0 9-8m-9 8 9 8" fill="none" stroke="#7ee8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="arrow arrow-right" d="m438 222 28 0m0 0-9-8m9 8-9 8" fill="none" stroke="#7ee8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="48" fill="#aaa" font-family="monospace" font-size="13" letter-spacing="2">OBJETO / DESMOLDE EN CONCRETO</text>
  <text x="475" y="466" fill="#7ee8ff" font-family="monospace" font-size="10" letter-spacing="1.5">MOLDE → PIEZA</text>
  <style>
    .en-pausa *{animation-play-state:paused!important}
    @media(prefers-reduced-motion:no-preference){.mold-left{animation:open-left 11s cubic-bezier(.76,0,.24,1) infinite}.mold-right{animation:open-right 11s cubic-bezier(.76,0,.24,1) infinite}.piece{transform-box:fill-box;transform-origin:center;animation:reveal 11s cubic-bezier(.16,1,.3,1) infinite}.piece-detail{animation:detail 11s ease infinite}.arrow{animation:arrow-show 11s ease-in-out infinite}}
    @keyframes open-left{0%,20%{transform:translateX(0)}43%,76%{transform:translateX(-42px)}88%,100%{transform:translateX(0)}}
    @keyframes open-right{0%,20%{transform:translateX(0)}43%,76%{transform:translateX(42px)}88%,100%{transform:translateX(0)}}
    @keyframes reveal{0%,24%{opacity:.18;transform:scale(.96)}46%,78%{opacity:1;transform:scale(1)}90%,100%{opacity:.18;transform:scale(.96)}}
    @keyframes detail{0%,42%{opacity:.15}55%,78%{opacity:.7}90%,100%{opacity:.15}}
    @keyframes arrow-show{0%,32%{opacity:0}45%,70%{opacity:1}82%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.mold-left{transform:translateX(-42px)}.mold-right{transform:translateX(42px)}.piece,.piece-detail,.arrow{opacity:1;transform:none}}
  </style>
</svg>
