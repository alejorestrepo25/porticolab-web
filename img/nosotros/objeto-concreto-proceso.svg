<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Pieza de concreto</title><desc id="d">Se arma el molde, se vacía el concreto, se desencofra la pieza en forma de escalera y se deja secar.</desc>
<defs>
<radialGradient id="fondo" cx=".5" cy=".38" r=".75"><stop stop-color="#1c1c22"/><stop offset="1" stop-color="#0d0d10"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd6e4" stop-opacity=".22"/></linearGradient>
<linearGradient id="molde" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd3dc" stop-opacity=".30"/><stop offset="1" stop-color="#7fd3dc" stop-opacity=".14"/></linearGradient>
<pattern id="tablas" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8a467"/><path d="M0 9.5H10" stroke="#9c6a35" stroke-opacity=".55"/></pattern>
</defs>
<style>

@keyframes moldeA{0%{transform:translate(-66.7px,-38.5px);opacity:0}4%{opacity:1}18%,50%{transform:none;opacity:1}64%{transform:translate(-66.7px,-38.5px);opacity:1}72%,100%{transform:translate(-66.7px,-38.5px);opacity:0}}
@keyframes moldeB{0%{transform:translate(66.7px,38.5px);opacity:0}4%{opacity:1}18%,50%{transform:none;opacity:1}64%{transform:translate(66.7px,38.5px);opacity:1}72%,100%{transform:translate(66.7px,38.5px);opacity:0}}
@keyframes nivel{0%,22%{transform:scaleY(0)}46%,100%{transform:scaleY(1)}}
@keyframes chorro{0%,20%{opacity:0;transform:scaleY(0)}24%{opacity:1;transform:scaleY(1)}44%{opacity:1;transform:scaleY(1)}48%,100%{opacity:0;transform:scaleY(1)}}
@keyframes sombra{0%,24%{opacity:0}46%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes humeda{0%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes seca{0%,68%{opacity:0}86%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes vapor{0%,66%{opacity:0;transform:none}74%{opacity:1}86%,100%{opacity:0;transform:translateY(-22px)}}
@keyframes flecha{0%,50%{opacity:0}54%,64%{opacity:1}70%,100%{opacity:0}}
.moldeA{animation:moldeA 9s cubic-bezier(.5,0,.2,1) infinite}
.moldeB{animation:moldeB 9s cubic-bezier(.5,0,.2,1) infinite}
.nivel{transform-box:fill-box;transform-origin:50% 100%;animation:nivel 9s cubic-bezier(.4,0,.4,1) infinite}
.chorro{transform-box:fill-box;transform-origin:50% 0;animation:chorro 9s ease-in-out infinite}
.humeda{animation:humeda 9s linear infinite}
.sombra{animation:sombra 9s ease-in-out infinite}
.seca{animation:seca 9s ease-in-out infinite}
.vapor{opacity:0;animation:vapor 9s ease-out infinite both}
.v1{animation-delay:.25s}.v2{animation-delay:.5s}
.flecha{animation:flecha 9s ease-in-out infinite}

.en-pausa *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
