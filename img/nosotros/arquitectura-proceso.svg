<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Pabellón modular</title><desc id="d">Se funden los dados de cimentación, se vacía la plancha, se levanta la estructura metálica y se monta la cubierta curva translúcida.</desc>
