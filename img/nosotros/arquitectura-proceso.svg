<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Pabellón modular</title><desc id="d">Se coloca la plataforma de madera, se levantan los postes y vigas metálicas y se monta la cubierta curva translúcida.</desc>
<defs>
<radialGradient id="fondo" cx=".5" cy=".38" r=".75"><stop stop-color="#1c1c22"/><stop offset="1" stop-color="#0d0d10"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd6e4" stop-opacity=".22"/></linearGradient>
<linearGradient id="molde" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd3dc" stop-opacity=".30"/><stop offset="1" stop-color="#7fd3dc" stop-opacity=".14"/></linearGradient>
<pattern id="tablas" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8a467"/><path d="M0 9.5H10" stroke="#9c6a35" stroke-opacity=".55"/></pattern>
</defs>
<style>

@keyframes deck{0%{opacity:0;transform:translateY(-30px)}6%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}
@keyframes postes{0%,26%{opacity:0;transform:scaleY(0)}36%,92%{opacity:1;transform:scaleY(1)}98%,100%{opacity:0;transform:scaleY(1)}}
@keyframes vigas{0%,36%{opacity:0;transform:translateY(-26px)}44%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes techo{0%,52%{opacity:0;transform:translateY(-70px)}64%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
.deck{animation:deck 9s cubic-bezier(.2,.8,.2,1) infinite}
.postes{transform-box:fill-box;transform-origin:50% 100%;animation:postes 9s cubic-bezier(.2,.8,.2,1) infinite}
.vigas{animation:vigas 9s cubic-bezier(.2,.8,.2,1) infinite}
.techo{animation:techo 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes paso1{0%,5%{opacity:.38}9%,28%{opacity:1}32%,100%{opacity:.38}}
.paso1{animation:paso1 9s ease-in-out infinite;opacity:.38}
@keyframes paso2{0%,29%{opacity:.38}33%,54%{opacity:1}58%,100%{opacity:.38}}
.paso2{animation:paso2 9s ease-in-out infinite;opacity:.38}
@keyframes paso3{0%,55%{opacity:.38}59%,90%{opacity:1}94%,100%{opacity:.38}}
.paso3{animation:paso3 9s ease-in-out infinite;opacity:.38}
.en-pausa *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
