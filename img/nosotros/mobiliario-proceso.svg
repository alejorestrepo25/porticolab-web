<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Silla de madera</title><desc id="d">Se levantan las patas, se ensamblan los travesaños, se fija la tabla del asiento y se monta el espaldar curvado.</desc>
<defs>
<radialGradient id="fondo" cx=".5" cy=".38" r=".75"><stop stop-color="#1c1c22"/><stop offset="1" stop-color="#0d0d10"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd6e4" stop-opacity=".22"/></linearGradient>
<linearGradient id="molde" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd3dc" stop-opacity=".30"/><stop offset="1" stop-color="#7fd3dc" stop-opacity=".14"/></linearGradient>
<pattern id="tablas" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8a467"/><path d="M0 9.5H10" stroke="#9c6a35" stroke-opacity=".55"/></pattern>
</defs>
<style>

@keyframes patas{0%,2%{opacity:0;transform:scaleY(0)}14%,92%{opacity:1;transform:scaleY(1)}98%,100%{opacity:0;transform:scaleY(1)}}
@keyframes ensamble{0%,18%{opacity:0;transform:translateY(-24px)}30%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes tabla{0%,36%{opacity:0;transform:translateY(-60px)}48%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes tornillo{0%,48%{opacity:0}52%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes espaldar{0%,56%{opacity:0;transform:translateY(-90px)}70%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
.patas{transform-box:fill-box;transform-origin:50% 100%;animation:patas 9s cubic-bezier(.2,.8,.2,1) infinite}
.ensamble{animation:ensamble 9s cubic-bezier(.2,.8,.2,1) infinite}
.tabla{animation:tabla 9s cubic-bezier(.2,.8,.2,1) infinite}
.tabla .tornillo{animation:tornillo 9s ease-out infinite}
.espaldar{animation:espaldar 9s cubic-bezier(.3,.7,.2,1) infinite}

.en-pausa *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
