<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
<title id="t">Silla de madera</title><desc id="d">Sobre un marco de madera maciza se apoya la concha de contrachapado curvado y se fija con tornillos.</desc>
<defs>
<radialGradient id="fondo" cx=".5" cy=".38" r=".75"><stop stop-color="#1c1c22"/><stop offset="1" stop-color="#0d0d10"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd6e4" stop-opacity=".22"/></linearGradient>
<linearGradient id="molde" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd3dc" stop-opacity=".30"/><stop offset="1" stop-color="#7fd3dc" stop-opacity=".14"/></linearGradient>
