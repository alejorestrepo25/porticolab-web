  <style>
    .en-pausa *{animation-play-state:paused!important}
    .sf{transform-box:fill-box;transform-origin:0 50%}
    .base,.asiento,.respaldo,.escuadras,.sombra,.guias,.destornillador{opacity:1}
    @media(prefers-reduced-motion:no-preference){
      .sombra{transform-box:fill-box;transform-origin:center;animation:sombra 9s cubic-bezier(.16,1,.3,1) infinite}
      .base{transform-box:fill-box;transform-origin:50% 100%;animation:base 9s cubic-bezier(.16,1,.3,1) infinite}
      .asiento{animation:asiento 9s cubic-bezier(.16,1,.3,1) infinite}
      .respaldo{animation:respaldo 9s cubic-bezier(.16,1,.3,1) infinite}
      .escuadras{animation:esc 9s ease-out infinite}
      .guias{animation:guias 9s ease-in-out infinite}
      .destornillador{animation:dest 9s cubic-bezier(.4,0,.2,1) infinite}
      .cruz{transform-box:fill-box;transform-origin:center;animation:giro 9s ease-in-out infinite}
      .t1 .cruz{animation-delay:.32s}.t2 .cruz{animation-delay:.64s}.t3 .cruz{animation-delay:.96s}
      .destello{animation:destello 9s ease-in-out infinite}
      .silla{transform-box:view-box;transform-origin:320.0px 350.0px;animation:mece 9s ease-in-out infinite}
      .sf1{animation:sf1 9s linear infinite}.sf2{animation:sf2 9s linear infinite}.sf3{animation:sf3 9s linear infinite}
    }
    @keyframes sombra{0%,3%{opacity:0;transform:scale(.4)}20%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
    @keyframes base{0%,5%{opacity:0;transform:scaleY(.05)}24%,90%{opacity:1;transform:scaleY(1)}97%,100%{opacity:0;transform:scaleY(1)}}
    @keyframes asiento{0%,22%{opacity:0;transform:translateY(-110px)}37%,90%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
    @keyframes respaldo{0%,50%{opacity:0;transform:translate(26px,-60px)}64%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
    @keyframes esc{0%,62%{opacity:0}68%,90%{opacity:1}97%,100%{opacity:0}}
    @keyframes guias{0%,20%{opacity:0}28%,40%{opacity:.9}46%,50%{opacity:0}54%,60%{opacity:.9}66%,100%{opacity:0}}
    @keyframes giro{0%,40%{transform:rotate(0)}44%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
    @keyframes dest{0%,38%{opacity:0;transform:translate(314.8px,219.0px)}39%{opacity:1;transform:translate(314.8px,259.0px)}42%{transform:translate(314.8px,259.0px)}43.5%{transform:translate(363.3px,287.0px)}45.5%{transform:translate(363.3px,287.0px)}47%{transform:translate(273.2px,283.0px)}49%{transform:translate(273.2px,283.0px)}50.5%{transform:translate(321.7px,311.0px)}52.5%{opacity:1;transform:translate(321.7px,311.0px)}55%,100%{opacity:0;transform:translate(321.7px,261.0px)}}
    @keyframes destello{0%,66%{opacity:0;transform:translateX(0)}70%{opacity:1}86%{opacity:1;transform:translateX(120px)}88%,100%{opacity:0;transform:translateX(120px)}}
    @keyframes mece{0%,74%{rotate:0deg}80%{rotate:-2.6deg}88%{rotate:2.2deg}94%{rotate:-.8deg}98%,100%{rotate:0deg}}
    @keyframes sf1{0%,5%{transform:scaleX(0);opacity:1}24%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}
    @keyframes sf2{0%,22%{transform:scaleX(0);opacity:1}52%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}
    @keyframes sf3{0%,50%{transform:scaleX(0);opacity:1}66%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}
    @media(prefers-reduced-motion:reduce){.base,.asiento,.respaldo,.escuadras,.sombra,.sf{opacity:1;transform:none}.guias,.destornillador{opacity:0}}
  </style>
</svg>
