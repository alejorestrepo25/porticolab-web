.marco{animation:marco 8s cubic-bezier(.2,.8,.2,1) infinite}
.concha{animation:concha 8s cubic-bezier(.3,.7,.2,1) infinite}
.concha .tornillo{animation:tornillo 8s ease-out infinite}
@keyframes paso1{0%,5%{opacity:.38}9%,28%{opacity:1}32%,100%{opacity:.38}}
.paso1{animation:paso1 8s ease-in-out infinite;opacity:.38}
@keyframes paso2{0%,29%{opacity:.38}33%,54%{opacity:1}58%,100%{opacity:.38}}
