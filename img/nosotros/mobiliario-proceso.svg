  <title id="title">Ensamblaje de una silla de madera moldeada</title>
  <desc id="desc">Una silla de contrachapado se arma sobre una base de acero tubular: el asiento se atornilla al bastidor con un destornillador y el respaldo se fija con escuadras metálicas.</desc>
